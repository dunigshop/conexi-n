<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070a">
<title>Barbería Los Andes · Citas</title>
<link rel="stylesheet" href="../assets/lux.css">
<style>
body{padding-bottom:40px}
.hd{position:relative;height:196px}
.hd::after{background:linear-gradient(180deg,rgba(7,7,10,.15),rgba(7,7,10,.45) 50%,#07070a)}
.hd .tx{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.hd h1{font-family:Playfair,serif;font-size:31px;font-weight:800;line-height:1.02;margin:8px 0 4px}
.hd p{font-size:11px;color:#e6dfcc}
h2{font-size:11px;letter-spacing:2px;color:var(--g1);font-weight:600;margin:16px 18px 9px;display:flex;align-items:center;gap:8px}
h2 i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#1a1200;background:var(--goldv)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.s{border-radius:18px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative}
.s .ph{height:74px}.s .ph::after{background:linear-gradient(180deg,transparent 30%,rgba(7,7,10,.85))}
.s .in{padding:7px 10px 9px}.s b{font-size:12.5px;display:block;font-weight:600}.s span{font-size:10px;color:var(--mut)}
.s i{position:absolute;top:8px;right:8px;z-index:2;font-style:normal;font-family:Playfair,serif;font-weight:800;font-size:14px;padding:2px 9px;border-radius:999px;color:#1a1200;background:var(--goldv)}
.s.on{border-color:var(--g1);box-shadow:0 0 0 2px var(--g2),0 0 26px rgba(212,175,55,.45);transform:scale(1.03)}
.days{display:flex;gap:9px;padding:0 16px}
.d{flex:1;text-align:center;border-radius:16px;padding:9px 0;transition:.25s}
.d small{display:block;font-size:10.5px;color:var(--mut)}.d b{font-family:Playfair,serif;font-size:22px}
.d.on{background:var(--gold);background-size:250% auto;animation:shine 3.2s linear infinite;color:#1a1200;border-color:transparent;box-shadow:0 6px 20px rgba(212,175,55,.4)}.d.on small{color:#3a2a00}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.t{text-align:center;padding:10px 0;border-radius:13px;font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.25s}
.t.busy{opacity:.3;text-decoration:line-through}
.t.on{background:var(--gold);background-size:250% auto;animation:shine 3.2s linear infinite;color:#1a1200;border-color:transparent;box-shadow:0 0 20px rgba(212,175,55,.5);transform:scale(1.06)}
.inp{padding:0 16px}
.inp input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);font-size:15px;font-family:inherit;background:rgba(255,255,255,.04);color:var(--txt)}
.inp input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.cta{display:block;width:calc(100% - 32px);margin:16px 16px 0;padding:15px;border-radius:16px;font-size:16px;filter:grayscale(.85) brightness(.6);transition:filter .4s}
.cta.ready{filter:none}
.ok{position:fixed;inset:0;background:rgba(5,5,8,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;z-index:60}
.ok.on{opacity:1;pointer-events:auto}
.ok .card{width:86%;border-radius:26px;padding:22px 20px;text-align:center;transform:scale(.85);transition:transform .5s cubic-bezier(.2,1.4,.4,1);border-color:var(--line2)}
.ok.on .card{transform:none}
.ck{width:78px;height:78px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;color:#1a1200;background:var(--gold);background-size:250% auto;animation:shine 3.2s linear infinite;box-shadow:0 0 0 8px rgba(212,175,55,.15),0 0 40px rgba(212,175,55,.6)}
.ok h3{font-family:Playfair,serif;font-size:27px}
.r{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(212,175,55,.15)}.r span{color:var(--mut)}
.ok p{font-size:11.5px;color:var(--mut);margin-top:12px}
</style></head><body>
<div class="hd ph"><img class="kb" src="../assets/img/bb-hero.jpg"><div class="tx"><span class="kick"><b></b>RESERVA TU CITA</span><h1>Barbería <span class="gtxt">Los Andes</span></h1><p>Av. 4 Bolívar, Mérida · Martes a sábado</p></div></div>
<h2><i>1</i>ELIGE EL SERVICIO</h2>
<div class="svc" id="svc"></div>
<h2><i>2</i>ELIGE EL DÍA</h2>
<div class="days" id="days"></div>
<h2><i>3</i>HORA DISPONIBLE</h2>
<div class="slots" id="slots"></div>
<h2><i>4</i>TU NOMBRE</h2>
<div class="inp"><input id="nom" placeholder="Nombre y teléfono"></div>
<button class="cta gbtn" id="cta" onclick="confirmar()">Confirmar cita</button>
<div class="ok" id="ok"><div class="card glass"><div class="ck">✓</div><h3>¡Cita <span class="gtxt">confirmada!</span></h3><div style="margin-top:12px" id="res"></div><p>Te enviamos un recordatorio por WhatsApp 1 hora antes.</p></div></div>
<script>
const S=[["Corte clásico","30 min",5,"bb-corte"],["Corte + barba","45 min",8,"bb-barba"],["Degradado (fade)","40 min",6,"bb-fade"],["Afeitado","20 min",4,"bb-afeitado"]];
const DN=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],MN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const D=[];{let x=new Date();x.setHours(0,0,0,0);while(D.length<5){x.setDate(x.getDate()+1);const w=x.getDay();if(w>=2&&w<=6)D.push([DN[w],String(x.getDate()),MN[x.getMonth()],x.toISOString().slice(0,10)])}}
const T=["9:00","9:45","10:30","11:15","2:00","2:45","3:30","4:15"];
const SEED=[[0,2,5],[1,4],[0,1,3,6],[2,3,4],[5,7]];
const CITAS=JSON.parse(localStorage.getItem("bb_citas")||"[]");
function busyFor(i){const k=D[i][3];return SEED[i].concat(CITAS.filter(c=>c.f==k).map(c=>c.t))}
let st={s:null,d:null,t:null};
svc.innerHTML=S.map((s,i)=>`<div class="s glass" id="s${i}" onclick="pick('s',${i})"><i>$${s[2]}</i><div class="ph"><img class="${i%2?'kb2':'kb'}" style="animation-delay:-${i*2}s" src="../assets/img/${s[3]}.jpg"></div><div class="in"><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("");
days.innerHTML=D.map((d,i)=>`<div class="d glass" id="d${i}" onclick="pick('d',${i})"><small>${d[0]}</small><b>${d[1]}</b></div>`).join("");
function drawSlots(){const b=st.d==null?[]:busyFor(st.d);slots.innerHTML=T.map((t,i)=>`<div class="t ${b.includes(i)?"busy":""} ${st.t==i?"on":""}" id="t${i}" onclick="${b.includes(i)?"":`pick('t',${i})`}">${t}</div>`).join("")}
function pick(k,i){st[k]=i;if(k=="d")st.t=null;document.querySelectorAll(k=="s"?".s":k=="d"?".d":".t").forEach(e=>e.classList.remove("on"));if(k!="t")document.getElementById(k+i).classList.add("on");drawSlots();check()}
function check(){cta.classList.toggle("ready",st.s!=null&&st.d!=null&&st.t!=null)}
function confirmar(){if(!cta.classList.contains("ready"))return;const s=S[st.s],d=D[st.d],h=T[st.t];const pm=st.t>=4?"p. m.":"a. m.";
 res.innerHTML=[["Servicio",s[0]],["Día",d[0]+" "+d[1]+" de "+d[2]],["Hora",h+" "+pm],["Cliente",nom.value||"-"],["Total","$"+s[2]]].map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");ok.classList.add("on");
 CITAS.push({f:d[3],t:st.t,s:s[0],n:nom.value});localStorage.setItem("bb_citas",JSON.stringify(CITAS));st.t=null;drawSlots();check()}
ok.onclick=()=>ok.classList.remove("on");
drawSlots();
</script><script src="../assets/lux.js"></script></body></html>
