<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070a">
<title>Calculadora de precios · Repostería</title>
<link rel="stylesheet" href="../assets/lux.css">
<style>
body{padding-bottom:40px}
.hd{position:relative;height:178px}
.hd::after{background:linear-gradient(180deg,rgba(7,7,10,.25),rgba(7,7,10,.55) 55%,#07070a)}
.hd .tx{position:absolute;left:18px;right:18px;top:20px;z-index:2}
.hd h1{font-family:Playfair,serif;font-size:29px;font-weight:800;line-height:1.05;margin-top:9px}
.res{margin:-52px 16px 0;border-radius:24px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px;position:relative;z-index:3;border-color:var(--line2)}
.k{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.15);border-radius:15px;padding:10px}.k span{font-size:10.5px;color:var(--mut);display:block}.k b{font-family:Playfair,serif;font-size:21px}
.big{grid-column:1/3;text-align:center;padding:12px;background:radial-gradient(circle at 50% 0,rgba(212,175,55,.28),rgba(212,175,55,.04) 70%);border-color:rgba(212,175,55,.4)}
.big span{color:var(--g1);letter-spacing:1.4px;font-size:10.5px;font-weight:600}.big b{font-size:46px;display:block;line-height:1.1;transition:transform .15s;filter:drop-shadow(0 0 14px rgba(212,175,55,.35))}
.big .sub{font-size:11.5px;color:#e6dfcc;margin-top:1px}
.sec{margin:12px 16px 0;border-radius:20px;padding:13px 14px}
.sec h3{font-size:13.5px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ing{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(212,175,55,.13);font-size:13px;animation:in .6s both}
@keyframes in{from{opacity:0;background:rgba(212,175,55,.35)}}
.ing b{color:var(--g1)}.ing .del{background:none;border:0;color:var(--mut);font-size:16px;margin-left:10px;cursor:pointer}
.addr{display:flex;gap:7px;margin-top:10px}
.addr input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:rgba(255,255,255,.04);color:var(--txt)}
.addr input:focus{border-color:var(--g2)}
.addr input.c{flex:0 0 72px}
.addr button{border-radius:12px;padding:0 15px;font-size:18px}
.step{display:flex;align-items:center;justify-content:space-between}
.step .ctl{display:flex;align-items:center;gap:14px}
.step button{width:40px;height:40px;border-radius:12px;font-size:22px}
.step b{font-family:Playfair,serif;font-size:27px;min-width:36px;text-align:center}
input[type=range]{width:100%;-webkit-appearance:none;height:10px;border-radius:6px;border:0;padding:0;background:linear-gradient(90deg,#8a6a1f,#d4af37 calc(var(--p)*.6),#f7e7a1 var(--p),rgba(255,255,255,.08) var(--p));margin:14px 0 6px;box-shadow:0 0 14px rgba(212,175,55,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8d6,#d4af37 60%,#8a6a1f);border:2px solid #fff4c4;box-shadow:0 0 0 6px rgba(212,175,55,.18),0 0 18px rgba(212,175,55,.7)}
.mg{font-family:Playfair,serif;font-size:28px;font-weight:800}
.lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
</style></head><body>
<div class="hd ph"><img class="kb" src="../assets/img/ingredientes.jpg"><div class="tx"><span class="kick"><b></b>HERRAMIENTA PARA REPOSTERAS</span><h1>¿A cuánto vendo <span class="gtxt">mi torta?</span></h1></div></div>
<div class="res glass">
 <div class="k big"><span>PRECIO SUGERIDO POR PORCIÓN</span><b class="gtxt" id="pp">$0.00</b><div class="sub" id="pt">Torta completa: $0.00</div></div>
 <div class="k"><span>Costo total</span><b id="ct">$0.00</b></div>
 <div class="k"><span>Ganancia por torta</span><b id="gn" style="color:#7ff0b2">$0.00</b></div>
</div>
<div class="sec glass"><h3>Margen de ganancia <span class="mg gtxt" id="mgv">30%</span></h3>
 <input type="range" id="mg" min="0" max="150" value="30" oninput="calc()"><div class="lbl"><span>0%</span><span>75%</span><span>150%</span></div></div>
<div class="sec glass step"><h3 style="margin:0">Porciones</h3><div class="ctl"><button class="gbtn" id="menos" onclick="por(-1)">−</button><b class="gtxt" id="pv">12</b><button class="gbtn" id="mas" onclick="por(1)">+</button></div></div>
<div class="sec glass"><h3>Ingredientes <span style="color:var(--mut);font-size:11px;font-weight:400">Torta de chocolate</span></h3><div id="list"></div>
 <div class="addr"><input id="ni" placeholder="Ingrediente"><input id="nc" class="c" placeholder="$" inputmode="decimal"><button class="gbtn" id="addb" onclick="addI()">+</button></div></div>
<script>
const I=[["Harina de trigo (1 kg)",1.2],["Azúcar (1 kg)",0.9],["Huevos (6 und)",1.8],["Mantequilla (250 g)",2.5],["Chocolate en polvo",3],["Leche (1 L)",1.1],["Caja y base",1.5],["Gas y electricidad",0.8]];
const SV=JSON.parse(localStorage.getItem("rp_calc")||"null");if(SV){I.length=0;SV.I.forEach(x=>I.push(x));mg.value=SV.m}
let p=SV?SV.p:12;
function save(){localStorage.setItem("rp_calc",JSON.stringify({I,m:+mg.value,p}))}
function delI(k){I.splice(k,1);draw();calc()}
function draw(){list.innerHTML=I.map((i,k)=>`<div class="ing"><span>${i[0]}</span><span><b>$${i[1].toFixed(2)}</b><button class="del" onclick="delI(${k})" aria-label="Quitar">×</button></span></div>`).join("")}
function calc(){save();const m=+mg.value,c=I.reduce((s,i)=>s+i[1],0),t=c*(1+m/100);
 mg.style.setProperty("--p",(m/150*100)+"%");mgv.textContent=m+"%";ct.textContent="$"+c.toFixed(2);
 pp.textContent="$"+(t/p).toFixed(2);pt.textContent="Torta completa: $"+t.toFixed(2);gn.textContent="$"+(t-c).toFixed(2);pv.textContent=p;
 pp.style.transform="scale(1.06)";clearTimeout(window._t);window._t=setTimeout(()=>pp.style.transform="",150)}
function por(d){p=Math.max(1,p+d);calc()}
function addI(){const n=ni.value.trim(),c=parseFloat(nc.value.replace(",","."));if(!n||isNaN(c))return;I.push([n,c]);ni.value="";nc.value="";draw();calc()}
draw();calc();
</script><script src="../assets/lux.js"></script></body></html>
