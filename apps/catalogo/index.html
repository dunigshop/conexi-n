<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070a">
<title>Moda Sierra · Catálogo</title>
<link rel="stylesheet" href="../assets/lux.css">
<style>
.hd{padding:14px 16px 0}
.hd h1{font-family:Playfair,serif;font-size:27px;letter-spacing:4px;font-weight:800}
.hd small{font-size:10px;color:var(--mut);letter-spacing:1.6px}
.ban{margin:12px 16px 0;height:104px;border-radius:20px;border:1px solid var(--line2)}
.ban .ims{display:flex;height:100%}.ban .ims div{flex:1;overflow:hidden}.ban .ims img{width:100%;height:100%;object-fit:cover}
.ban::after{background:linear-gradient(90deg,rgba(7,7,10,.92) 0%,rgba(7,7,10,.55) 45%,rgba(7,7,10,.1))}
.ban .tx{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:2}
.ban .tx b{font-family:Playfair,serif;font-size:21px;display:block;line-height:1.1}.ban .tx>span{font-size:10.5px;color:#e6dfcc}
.search{margin:12px 16px 0;display:flex;align-items:center;gap:8px;border-radius:15px;padding:0 13px}
.search input{flex:1;border:0;padding:12px 0;font-size:15px;font-family:inherit;background:transparent;color:var(--txt)}
.search:focus-within{border-color:var(--g2);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.f{padding:11px 16px 0}.f h4{font-size:10px;color:var(--g1);letter-spacing:2px;margin-bottom:7px;font-weight:600}
.ch{display:flex;gap:6px;flex-wrap:wrap}
.c{padding:6px 11px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px;font-weight:600;color:var(--mut);transition:all .25s}
.c.on{background:var(--gold);background-size:250% auto;animation:shine 3.2s linear infinite;color:#1a1200;border-color:transparent;box-shadow:0 4px 16px rgba(212,175,55,.35)}
.sz .c{min-width:38px;text-align:center}
.meta{display:flex;justify-content:space-between;padding:12px 16px 2px;font-size:12px;color:var(--mut)}
.meta b{font-family:Playfair,serif;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:8px 16px 30px}
.p{border-radius:18px;overflow:hidden;animation:in .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:scale(.9) translateY(10px)}}
.p .ph{height:128px}.p .ph::after{display:none}
.tag{position:absolute;top:8px;left:8px;z-index:2;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:8px;color:#1a1200;background:var(--goldv)}
.p .i{padding:9px 10px 11px}.p h3{font-size:12.5px;font-weight:600}.p .t{font-size:10px;color:var(--mut);margin:2px 0 6px}
.p .pr{display:flex;justify-content:space-between;align-items:center}
.p .pr span{font-family:Playfair,serif;font-weight:800;font-size:17px}
.p .pr button{border-radius:9px;font-size:10.5px;padding:5px 9px}
.empty{grid-column:1/3;text-align:center;color:var(--mut);padding:30px}
</style></head><body>
<div class="hd"><h1><span class="gtxt">MODA SIERRA</span></h1><small>ROPA Y CALZADO · ENVÍOS A TODA VENEZUELA</small></div>
<div class="ban ph"><div class="ims"><div><img class="kb" src="../assets/img/m-vestido-negro.jpg"></div><div><img class="kb2" src="../assets/img/m-sandalia.jpg"></div><div><img class="kb" style="animation-delay:-3s" src="../assets/img/m-botin.jpg"></div></div><div class="tx"><b>Nueva <span class="gtxt">colección</span></b><span>Elegancia para cada ocasión</span></div></div>
<div class="search glass"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#d4af37" stroke-width="2.5"/><path d="m15 15 6 6" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/></svg><input id="q" placeholder="Buscar: vestido, tenis, jean..." oninput="draw()"></div>
<div class="f"><h4>CATEGORÍA</h4><div class="ch" id="cats"></div></div>
<div class="f sz"><h4>TALLA</h4><div class="ch" id="sizes"></div></div>
<div class="meta"><span><b class="gtxt" id="n">0</b> productos</span><span>Ordenar: Novedades</span></div>
<div class="grid" id="grid"></div>
<script>
/* ✏️ EDITABLE: número de WhatsApp del negocio (código de país + número, sin + ni espacios). Este es de EJEMPLO. */
const WHATSAPP="584140000000";
const CATS=["Todo","Camisas","Vestidos","Jeans","Zapatos","Deportivos"];
const SZ=["S","M","L","37","38","39","40","41"];
const P=[
["Camisa lino blanca","Camisas",["S","M","L"],18,"m-camisa-lino"],["Camisa cuadros","Camisas",["M","L"],15,"m-camisa-cuadros"],
["Vestido floral","Vestidos",["S","M"],24,"m-vestido-floral"],["Vestido negro midi","Vestidos",["S","M","L"],28,"m-vestido-negro"],
["Jean azul clásico","Jeans",["S","M","L"],22,"m-jean-azul"],["Jean negro slim","Jeans",["M","L"],22,"m-jean-negro"],
["Botín cuero","Zapatos",["38","39","40","41"],35,"m-botin"],["Sandalia dorada","Zapatos",["37","38","39"],19,"m-sandalia"],
["Mocasín marrón","Zapatos",["39","40","41"],30,"m-mocasin"],["Tenis running","Deportivos",["38","39","40","41"],32,"m-tenis-running"],
["Tenis blancos","Deportivos",["37","38","39","40"],27,"m-tenis-blancos"],["Tenis deportivos negros","Deportivos",["40","41"],34,"m-tenis-negros"]];
let cat="Todo",size=null;
cats.innerHTML=CATS.map(c=>`<span class="c" id="cat-${c}" onclick="setCat('${c}')">${c}</span>`).join("");
sizes.innerHTML=SZ.map(s=>`<span class="c" id="sz-${s}" onclick="setSz('${s}')">${s}</span>`).join("");
function setCat(c){cat=c;document.querySelectorAll("#cats .c").forEach(e=>e.classList.toggle("on",e.id=="cat-"+c));draw()}
function setSz(s){size=size==s?null:s;document.querySelectorAll("#sizes .c").forEach(e=>e.classList.toggle("on",e.id=="sz-"+size));draw()}
function norm(x){return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function draw(){const q=norm(document.getElementById("q").value.trim());
 const r=P.filter(p=>(cat=="Todo"||p[1]==cat)&&(!size||p[2].includes(size))&&(!q||norm(p[0]+" "+p[1]).includes(q)));
 n.textContent=r.length;
 grid.innerHTML=r.length?r.map((p,i)=>`<div class="p glass" style="animation-delay:${i*.05}s"><div class="ph">${i<1?'<span class="tag">NUEVO</span>':""}<img class="${i%2?'kb2':'kb'}" style="animation-delay:-${(P.indexOf(p)%5)*1.8}s" src="../assets/img/${p[4]}.jpg"></div><div class="i"><h3>${p[0]}</h3><div class="t">Tallas: ${p[2].join(" · ")}</div><div class="pr"><span class="gtxt">$${p[3]}</span><button class="gbtn" onclick="pedir(${P.indexOf(p)})">Pedir</button></div></div></div>`).join(""):`<div class="empty">No hay productos con esos filtros</div>`}
function pedir(i){const p=P[i];const m=`¡Hola, Moda Sierra! Me interesa: ${p[0]} ($${p[3]})${size?" · Talla "+size:""}. ¿Está disponible?`;window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank")}
const sv=JSON.parse(localStorage.getItem("ms_f")||"{}");if(sv.q)q.value=sv.q;size=sv.s||null;
const _d=draw;draw=function(){localStorage.setItem("ms_f",JSON.stringify({c:cat,s:size,q:q.value}));_d()};
setCat(sv.c||"Todo");if(size)document.querySelectorAll("#sizes .c").forEach(e=>e.classList.toggle("on",e.id=="sz-"+size));
</script><script src="../assets/lux.js"></script></body></html>
