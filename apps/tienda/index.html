<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070a">
<title>Dulces María · Tienda</title>
<link rel="stylesheet" href="../assets/lux.css">
<style>
body{padding-bottom:96px}
header{position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,10,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand b{font-family:Playfair,serif;font-size:23px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:10px;color:var(--mut);letter-spacing:2px;margin-top:1px}
.cartbtn{border-radius:14px;padding:9px 13px;font-size:13px;display:flex;gap:6px;align-items:center;overflow:visible}
.badge{position:absolute;top:-8px;right:-8px;background:#0b0a0d;color:var(--g1);border:1.5px solid var(--g2);border-radius:50%;width:24px;height:24px;font-size:12px;display:flex;align-items:center;justify-content:center;transition:transform .25s;z-index:2}
.badge.pop{transform:scale(1.5)}
.hero{margin:14px 16px 4px;height:206px;border-radius:24px;border:1px solid var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 40px rgba(212,175,55,.15)}
.hero::after{background:linear-gradient(180deg,rgba(7,7,10,.05) 20%,rgba(7,7,10,.92) 100%)}
.hero .tx{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}
.hero h1{font-family:Playfair,serif;font-size:27px;line-height:1.08;font-weight:700;margin:8px 0 4px}
.hero p{font-size:11.5px;color:#e6dfcc}
.chips{display:flex;gap:8px;padding:12px 16px 0}
.chip{cursor:pointer;padding:6px 13px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--mut);background:rgba(255,255,255,.03)}
.chip.on{background:var(--gold);background-size:250% auto;animation:shine 3.2s linear infinite;color:#1a1200;font-weight:700;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.card{border-radius:20px;overflow:hidden}
.card .ph{height:118px}
.card .in{padding:10px 11px 11px}
.card h3{font-size:13.5px;font-weight:600;line-height:1.2}.card .d{font-size:10.5px;color:var(--mut);margin:3px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-family:Playfair,serif;font-weight:800;font-size:19px}
.add{border-radius:11px;padding:7px 10px;font-size:11.5px}
.add.ok{background:#14301f;color:#7ff0b2;border:1px solid #2ee59d;animation:none;box-shadow:0 0 14px rgba(46,229,157,.35)}
.add.ok::after{display:none}
.bar{position:fixed;left:14px;right:14px;bottom:14px;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;font-size:14px;transform:translateY(150%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:25}
.bar.show{transform:none}
.drawer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,#17141a,#0b0a0d);border-top:1px solid var(--line2);border-radius:26px 26px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.7),0 -2px 30px rgba(212,175,55,.18);padding:16px 16px 20px;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:40;max-height:90vh;overflow:auto}
.drawer.open{transform:none}
.grab{width:44px;height:4px;border-radius:4px;background:var(--g3);margin:0 auto 12px}
.drawer h2{font-family:Playfair,serif;font-size:24px;margin-bottom:6px}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(212,175,55,.15);font-size:13.5px;gap:8px}
.it img{width:38px;height:38px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.it .nm{flex:1}
.qty{display:flex;align-items:center;gap:7px}.qty button{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--g1);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}
.total span:first-child{color:var(--mut);font-size:13px}.total b{font-family:Playfair,serif;font-size:28px}
label{font-size:10.5px;color:var(--g1);letter-spacing:1.4px;font-weight:600}
input{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);font-size:15px;margin:5px 0 10px;font-family:inherit;background:rgba(255,255,255,.04);color:var(--txt)}
input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.wa{width:100%;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff;border:1px solid rgba(247,231,161,.5);border-radius:15px;padding:14px;font-size:15px;font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center;font-family:inherit;box-shadow:0 8px 24px rgba(37,211,102,.3)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:35}.shade.on{opacity:1}
.chat{position:fixed;inset:0;background:#0b141a;z-index:60;transform:translateX(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.chat::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(212,175,55,.08),transparent 50%)}
.chat.open{transform:none}
.chat .x{background:none;border:0;color:#fff;font-size:28px;line-height:1;padding:0 6px 0 0;cursor:pointer}
.wahint{position:relative;margin:16px 14px;font-size:12px;color:var(--mut);text-align:center}.wahint a{color:var(--g1)}
.chat .top{position:relative;background:#1f2c34;color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;border:1.5px solid var(--g2)}.av img{width:100%;height:100%;object-fit:cover}
.bub{position:relative;margin:18px 14px 0 46px;background:#005c4b;color:#e9fbf4;border-radius:14px 0 14px 14px;padding:12px 14px;font-size:13.5px;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.4);animation:rise .5s both}
.tick{text-align:right;font-size:10.5px;color:#53bdeb;margin-top:4px}
.sent{position:relative;margin:14px auto;width:max-content;padding:6px 14px;border-radius:999px;font-size:11px;color:var(--g1);border:1px solid var(--line);background:rgba(212,175,55,.08)}
</style></head><body>
<header><div class="brand"><b class="gtxt">Dulces María</b><small>REPOSTERÍA DE AUTOR · MÉRIDA</small></div>
<button class="cartbtn gbtn" id="cartBtn" onclick="openCart()"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2" fill="none" stroke="#1a1200" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="20" r="1.6" fill="#1a1200"/><circle cx="17" cy="20" r="1.6" fill="#1a1200"/></svg>Carrito<span class="badge" id="badge">0</span></button></header>
<div class="hero ph"><img class="kb" src="../assets/img/hero-dulces.jpg"><div class="tx"><span class="kick"><b></b>ABIERTO · ENTREGA MAÑANA</span><h1>Antojos hechos <span class="gtxt">con amor</span></h1><p>Pago móvil, Zelle o efectivo · Delivery en Mérida</p></div></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="bar gbtn" id="bar" onclick="openCart()"><span id="barN">0 productos</span><span id="barT">$0.00 · Ver carrito</span></div>
<div class="shade" id="shade" onclick="closeCart()"></div>
<div class="drawer" id="drawer"><div class="grab"></div>
 <h2>Tu <span class="gtxt">pedido</span></h2><div id="items"></div>
 <div class="total"><span>Total</span><b class="gtxt" id="tot">$0.00</b></div>
 <label>NOMBRE</label><input id="nombre" placeholder="Tu nombre">
 <label>DIRECCIÓN DE ENTREGA</label><input id="dir" placeholder="Urbanización, calle, casa">
 <button class="wa" id="waBtn" onclick="enviar()"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z" fill="#fff"/><path d="M8.5 7.5c.3-.6.6-.6 1-.6l.6.1 1 2.3-.6.9c.5 1.1 1.4 2 2.6 2.6l.9-.7 2.3 1c0 .5-.2 1.2-.8 1.6-1.6 1-5.8-1.4-7.2-4.6-.4-.9-.2-2 .2-2.6z" fill="#25d366"/></svg>Enviar pedido por WhatsApp</button>
</div>
<div class="chat" id="chat"><div class="top"><button class="x" onclick="chat.classList.remove('open')" aria-label="Volver">‹</button><div class="av"><img src="../assets/img/torta.jpg"></div><div><b>Dulces María</b><div style="font-size:12px;opacity:.75">en línea</div></div></div>
<div class="sent">Pedido enviado ✓</div><div class="bub" id="msg"></div><div class="wahint">Si WhatsApp no se abrió, <a id="waA" target="_blank" rel="noopener">tócalo aquí</a>.</div></div>
<script>
/* ✏️ EDITABLE: número de WhatsApp del negocio (código de país + número, sin + ni espacios). Este es de EJEMPLO. */
const WHATSAPP="584140000000";
const P=[
{id:1,n:"Torta de chocolate",d:"Rinde 12 porciones",p:18,i:"torta",c:"Tortas"},
{id:2,n:"Quesillo",d:"Caramelo dorado",p:8,i:"quesillo",c:"Postres"},
{id:3,n:"Galletas (docena)",d:"Mantequilla y chispas",p:5,i:"galletas",c:"Galletas"},
{id:4,n:"Torta tres leches",d:"Rinde 10 porciones",p:15,i:"tres-leches",c:"Tortas"},
{id:5,n:"Marquesa de chocolate",d:"Bandeja mediana",p:10,i:"marquesa",c:"Postres"},
{id:6,n:"Alfajores (6 und)",d:"Rellenos de arequipe",p:6,i:"alfajores",c:"Galletas"}];
const cart=JSON.parse(localStorage.getItem("dm_cart")||"{}");let fil="Todo";
nombre.value=localStorage.getItem("dm_nombre")||"";dir.value=localStorage.getItem("dm_dir")||"";
chips.innerHTML=["Todo","Tortas","Postres","Galletas"].map(c=>`<span class="chip" data-c="${c}" onclick="setF('${c}')">${c}</span>`).join("");
function setF(c){fil=c;document.querySelectorAll(".chip").forEach(e=>e.classList.toggle("on",e.dataset.c==c));drawG()}
function drawG(){grid.innerHTML=P.filter(p=>fil=="Todo"||p.c==fil).map((p,i)=>`<div class="card glass rise" style="animation-delay:${.1+i*.07}s"><div class="ph"><img class="${i%2?'kb2':'kb'}" style="animation-delay:-${i*1.7}s" src="../assets/img/${p.i}.jpg"></div><div class="in"><h3>${p.n}</h3><div class="d">${p.d}</div><div class="row"><span class="price gtxt">$${p.p}</span><button class="add gbtn" id="add${p.id}" onclick="add(${p.id},this)">${cart[p.id]?"✓ "+cart[p.id]:"+ Agregar"}</button></div></div></div>`).join("");document.querySelectorAll(".add").forEach(b=>{if(b.textContent.startsWith("✓"))b.classList.add("ok")})}
function add(id,b){cart[id]=(cart[id]||0)+1;b.textContent="✓ "+cart[id];b.classList.add("ok");render();badge.classList.add("pop");setTimeout(()=>badge.classList.remove("pop"),250)}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];render();drawG()}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function total(){return Object.entries(cart).reduce((s,[id,q])=>s+P.find(p=>p.id==id).p*q,0)}
function render(){localStorage.setItem("dm_cart",JSON.stringify(cart));const n=count(),t=total();badge.textContent=n;barN.textContent=n+(n==1?" producto":" productos");barT.textContent="$"+t.toFixed(2)+" · Ver carrito";bar.classList.toggle("show",n>0);
 items.innerHTML=Object.entries(cart).map(([id,q])=>{const p=P.find(x=>x.id==id);return `<div class="it"><img src="../assets/img/${p.i}.jpg"><span class="nm">${p.n}</span><span class="qty"><button onclick="chg(${id},-1)">−</button>${q}<button onclick="chg(${id},1)">+</button><b style="width:52px;text-align:right;color:var(--g1)">$${(p.p*q).toFixed(2)}</b></span></div>`}).join("");tot.textContent="$"+t.toFixed(2)}
function openCart(){drawer.classList.add("open");shade.classList.add("on")}
function closeCart(){drawer.classList.remove("open");shade.classList.remove("on")}
function enviar(){if(!count()){alert("Tu carrito está vacío");return}localStorage.setItem("dm_nombre",nombre.value);localStorage.setItem("dm_dir",dir.value);const lines=Object.entries(cart).map(([id,q])=>{const p=P.find(x=>x.id==id);return `• ${q} x ${p.n} — $${(p.p*q).toFixed(2)}`}).join("\n");
 const m=`¡Hola, Dulces María! Quiero hacer este pedido:\n${lines}\n\nTotal: $${total().toFixed(2)}\nNombre: ${nombre.value||"-"}\nEntrega: ${dir.value||"-"}`;
 const link="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m);waA.href=link;
 const hh=new Date().toLocaleTimeString("es-VE",{hour:"2-digit",minute:"2-digit"});
 msg.innerHTML=m.replace(/</g,"&lt;").replace(/\n/g,"<br>")+'<div class="tick">'+hh+' ✓✓</div>';chat.classList.add("open");closeCart();
 window.open(link,"_blank");}
setF("Todo");render();
</script><script src="../assets/lux.js"></script></body></html>
